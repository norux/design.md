name: Notify design consumers

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: Existing design release tag to notify consumers about
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: notify-design-consumers-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - id: source
        name: Resolve released commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Create consumer issues
        env:
          DESIGN_REPOSITORY: ${{ github.repository }}
          DESIGN_SHA: ${{ steps.source.outputs.sha }}
          GITHUB_API_URL: ${{ github.api_url }}
          CONSUMER_ISSUES_TOKEN: ${{ secrets.CONSUMER_ISSUES_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
          RELEASE_URL: ${{ github.event.release.html_url || format('{0}/{1}/releases/tag/{2}', github.server_url, github.repository, inputs.tag) }}
        run: node scripts/notify-consumers.ts
